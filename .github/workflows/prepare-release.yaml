name: Prepare Release

# Strategy C, step 1 of 2 (see docs/release-workflow.md).
#
# Opens the version-bump PR for the release. `version`'s suffix IS the channel
# (`1.0.0-dev` / `1.1.0-rc1` => pre-release, `1.0.0` => stable), and every
# downstream step derives the channel from the same place -- the VERSION_* lines
# this workflow writes into CMakeLists.txt. `branch` is the line the bump lands
# on: master, or the version's release/<major>.<minor> branch.
#
# Post-bump after a stable release is the SAME operation: dispatch this
# workflow again with the next development version (e.g. `1.1.0-dev`).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare, without the leading v (e.g. 1.0.0-dev, 1.1.0-rc1, 1.1.0)"
        type: string
        required: true
      branch:
        description: "Branch to prepare it on: master, or the version's release/<major>.<minor> branch (e.g. release/1.1 for 1.1.0-rc1)"
        type: string
        required: true
        default: master

defaults:
  run:
    shell: bash

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Open version-bump PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Untrusted dispatch inputs: environment variables only, never interpolated
      # into a script body.
      VERSION: ${{ inputs.version }}
      TARGET_BRANCH: ${{ inputs.branch }}
    steps:
      # master stays at the workspace root: its parser vets the inputs and edits
      # the target branch's CMakeLists.txt, so no code from the target branch runs
      # here.
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Validate the version and the target branch
        run: |
          set -euo pipefail

          # The grammar is cmake-version.py's VERSION_RE, asserted by the parser
          # itself rather than re-spelled here: an inline copy is one edit away
          # from accepting a version the writer below would then reject.
          python3 .github/scripts/cmake-version.py validate "$VERSION" \
            || { echo "::error::Version '$VERSION' must be semver X.Y.Z with an optional -suffix (e.g. 1.0.0-dev)."; exit 1; }
          python3 .github/scripts/cmake-version.py validate "$VERSION" --branch "$TARGET_BRANCH" \
            || { echo "::error::${VERSION} is prepared on master or its own release/<major>.<minor> branch, not '${TARGET_BRANCH}'."; exit 1; }

          # Once a line has its release branch, its versions are prepared there.
          if [[ "$TARGET_BRANCH" == master ]]; then
            release_branch="$(python3 .github/scripts/cmake-version.py release-branch "$VERSION")"
            status=0
            git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" >/dev/null || status=$?
            if [[ $status -eq 0 ]]; then
              echo "::error::${release_branch} exists, so ${VERSION} is prepared there, not on master."
              exit 1
            elif [[ $status -ne 2 ]]; then
              echo "::error::Could not check origin for ${release_branch} (git ls-remote exit ${status})."
              exit 1
            fi
          fi

      # refs/heads/ so a tag that shares the branch's name is never checked out.
      - name: Check out the target branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ inputs.branch }}
          path: target
          fetch-depth: 0

      - name: Edit CMakeLists.txt
        id: bump
        run: |
          set -euo pipefail

          channel="stable"
          [[ "$VERSION" == *-* ]] && channel="prerelease"

          # The four VERSION_* lines are the single source of truth, and
          # .github/scripts/cmake-version.py is the ONE parser that reads and
          # writes them -- shared with tag-release.yaml's assertion and
          # release.yaml's tag cross-check, so those can never drift apart.
          # `write` prints the version it reads back, so a silent no-op edit
          # (the failure mode of the inline sed this replaced) fails here.
          previous="$(python3 .github/scripts/cmake-version.py read --cmakelists target/CMakeLists.txt)"
          written="$(python3 .github/scripts/cmake-version.py write "$VERSION" --cmakelists target/CMakeLists.txt)"
          if [[ "$written" != "$VERSION" ]]; then
            echo "::error::CMakeLists.txt reads back as '$written' after the edit, expected '$VERSION'."
            exit 1
          fi

          echo "--- CMakeLists.txt version block ---"
          grep -nE '^set\(VERSION_(MAJOR|MINOR|PATCH|SUFFIX)' target/CMakeLists.txt

          # The parser names the bump branch, so the PR version check recognizes it.
          prep_branch="$(python3 .github/scripts/cmake-version.py prep-branch "$VERSION")"

          {
            echo "channel=$channel"
            echo "previous=$previous"
            echo "prep-branch=$prep_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Push branch and open PR
        working-directory: target
        env:
          CHANNEL: ${{ steps.bump.outputs.channel }}
          PREP_BRANCH: ${{ steps.bump.outputs.prep-branch }}
        run: |
          branch="$PREP_BRANCH"

          # A prep branch with an open PR into another branch belongs to that
          # preparation: force-pushing it would re-point that PR at this
          # branch's history.
          open_bases="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
            --json baseRefName --jq '.[].baseRefName')"
          other_bases="$(grep -vxF -- "$TARGET_BRANCH" <<<"$open_bases" || true)"
          if [[ -n "$other_bases" ]]; then
            echo "::error::${branch} has an open PR into ${other_bases//$'\n'/, }. Close it before preparing ${VERSION} on ${TARGET_BRANCH}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          if git diff --quiet; then
            echo "::error::CMakeLists.txt already reads $VERSION on $TARGET_BRANCH; nothing to prepare."
            exit 1
          fi
          git add CMakeLists.txt
          git commit -m "chore(release): prepare v${VERSION}"
          git push --force-with-lease origin "$branch"

          # printf, not a heredoc: heredoc bodies would have to start at column
          # 0, which terminates the YAML block scalar this step lives in.
          body="$(printf '%s\n' \
            "Prepares the \`v${VERSION}\` release on \`${TARGET_BRANCH}\` (channel: **${CHANNEL}**)." \
            "" \
            "- \`CMakeLists.txt\` VERSION_MAJOR/MINOR/PATCH/SUFFIX set to \`${VERSION}\`." \
            "- Every package / artifact / asset name derives from those lines; \`release.yaml\` fails fast on any tag-vs-version mismatch." \
            "" \
            "After merging, dispatch **Tag Release** with version \`${VERSION}\` and branch \`${TARGET_BRANCH}\`.")"
          # NOTE: a PR opened with GITHUB_TOKEN starts its checks in the
          # approval-required state -- the human gate includes an
          # "Approve and run" click before the packaging checks report.
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$branch" \
            --title "chore(release): prepare v${VERSION}" \
            --body "$body"
