name: "Build & Test"

on:
  push:
    branches:
      - master
      - "release/*"
  pull_request:
    branches: 
      - master
      - develop
  workflow_dispatch:

permissions:
  # build-platforms publishes the container image to GHCR.
  packages: write
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover Platforms
    runs-on: ubuntu-24.04
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      p: ${{steps.discover.outputs.platforms}}
    steps:
      - name: Discover Platforms
        id: discover
        uses: Wire-Network/discover-platforms-action@v2
        with:
          platform-file: .cicd/platforms.json
          password: ${{secrets.GH_TOKEN}}
          package-name: builders-cdt
  build-platforms:
    name: Build Platforms
    needs: discover
    if: needs.discover.outputs.missing-platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.discover.outputs.missing-platforms)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
          file: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].dockerfile}}
  build:
    name: Build & Test
    needs: [discover, build-platforms]
    # !cancelled() (not always()) so this job still runs when build-platforms is
    # skipped, but a cancelled run actually stops it. always() makes the job run
    # even when the workflow is cancelled, which is why cancelling left the build
    # running to completion.
    if: ${{ !cancelled() && needs.discover.result == 'success' && (needs.build-platforms.result == 'success' || needs.build-platforms.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu24]
    runs-on: ubuntu-24.04
    container: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
    env:
      # Package on every ubuntu24 build (PRs included): verify-packages and the
      # release workflow both consume the artifact, and PR coverage catches
      # packaging regressions before merge (same policy as wire-sysio).
      SHOULD_PACKAGE: ${{ matrix.platform == 'ubuntu24' }}
      CCACHE_MAXSIZE: "10G"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
        - uses: actions/checkout@v5
          with:
            submodules: recursive
        - name: Restore ccache
          id: restore-ccache
          uses: actions/cache/restore@v5
          with:
            path: .ccache
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ github.sha }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-ccache-
        - name: Restore vcpkg downloads
          id: restore-vcpkg-downloads
          uses: actions/cache/restore@v5
          with:
            path: vcpkg/downloads
            # Caches are immutable: save (below, on always()) uses this unique
            # per-run key so failed/cancelled builds still bank their vcpkg work;
            # restore takes the newest cache by prefix, preferring one built from
            # the same manifests.
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-
        - name: Restore vcpkg binary archives
          id: restore-vcpkg-binary
          uses: actions/cache/restore@v5
          with:
            path: .vcpkg-binary-cache
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-
        - name: Build
          run: |
            export CC=/usr/bin/clang-18
            export CXX=/usr/bin/clang++-18
            export CCACHE_DIR="$PWD/.ccache"
            # VCPKG_BINARY_SOURCES only works as an environment variable: vcpkg.cmake
            # consumes no -D of that name, so the previous -D form silently did nothing
            # and vcpkg wrote its archives to ~/.cache/vcpkg outside the cached path.
            export VCPKG_BINARY_SOURCES="clear;files,$PWD/.vcpkg-binary-cache,readwrite"
            cmake --version
            ccache --version

            chown -R "$(id -u):$(id -g)" "$PWD"
            ./vcpkg/bootstrap-vcpkg.sh

            cmake -B build -S . -G Ninja \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_TARGET_TRIPLET=x64-linux-release \
              -DVCPKG_HOST_TRIPLET=x64-linux-release \
              -DVCPKG_OVERLAY_TRIPLETS="$PWD/.github/vcpkg-triplets"

            cmake --build build -- -j "$(nproc)"
        - name: Restore CTest cost data
          uses: actions/cache/restore@v5
          with:
            # CTest schedules higher-cost tests first when running with -j.
            path: build/Testing/Temporary/CTestCostData.txt
            key: ctest-cost-${{ matrix.platform }}-${{ github.sha }}
            restore-keys: |
              ctest-cost-${{ matrix.platform }}-
        - name: Test
          run: |
            TEST_COUNT="$(ctest --test-dir build -N | sed -nE 's/^Total Tests:[[:space:]]*([0-9]+).*/\1/p' | tail -n 1)"
            if [[ -z "$TEST_COUNT" || "$TEST_COUNT" -eq 0 ]]; then
              echo "CTest discovered no tests in build." >&2
              exit 1
            fi
            ctest --test-dir build -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)" --output-on-failure
        - name: Save CTest cost data
          if: ${{ always() && hashFiles('build/Testing/Temporary/CTestCostData.txt') != '' }}
          uses: actions/cache/save@v5
          with:
            # Caches are immutable; save under a unique key, restore by prefix.
            path: build/Testing/Temporary/CTestCostData.txt
            key: ctest-cost-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        - name: Save ccache
          if: ${{ always() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true' }}
          uses: actions/cache/save@v5
          with:
            path: .ccache
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ github.sha }}
        - name: Save vcpkg downloads
          # always(): bank vcpkg work even when the build fails or is cancelled —
          # cancel-in-progress iteration otherwise discards it on every push. The
          # guard only skips the save when the restore step never ran at all.
          if: ${{ always() && steps.restore-vcpkg-downloads.outputs.cache-primary-key != '' }}
          uses: actions/cache/save@v5
          with:
            path: vcpkg/downloads
            key: ${{ steps.restore-vcpkg-downloads.outputs.cache-primary-key }}
        - name: Save vcpkg binary archives
          if: ${{ always() && steps.restore-vcpkg-binary.outputs.cache-primary-key != '' }}
          uses: actions/cache/save@v5
          with:
            path: .vcpkg-binary-cache
            key: ${{ steps.restore-vcpkg-binary.outputs.cache-primary-key }}
        - name: Build packages (tgz + deb + rpm, base + dev)
          if: env.SHOULD_PACKAGE == 'true'
          working-directory: build
          run: |
            # The RPM generator needs rpmbuild; the builder image is Debian-based.
            command -v rpmbuild >/dev/null || { apt-get update && apt-get install -y rpm; }
            cpack -G DEB
            cpack -G RPM
            cmake --build . --target package-tgz
            ls -lh cdt*.deb cdt*.rpm cdt*.tar.gz
        - name: Upload package artifacts
          if: env.SHOULD_PACKAGE == 'true'
          uses: actions/upload-artifact@v7
          with:
            name: cdt_ubuntu_package_amd64
            path: |
              build/cdt_*.deb
              build/cdt-dev_*.deb
              build/cdt-*.rpm
              build/cdt-*.tar.gz
            if-no-files-found: error
            retention-days: 30
            compression-level: 0
  verify-packages:
    name: Verify packages
    needs: [build]
    # Same guard pattern as `build`: build-platforms is usually skipped (image
    # already published), and a skipped ancestor propagates through the default
    # success() check, silently skipping this job.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: cdt_ubuntu_package_amd64
          path: artifacts
      - name: Run packaging verification suite
        run: |
          ls -la artifacts/
          tools/packaging/tests/verify-scripts.sh
          tools/packaging/tests/verify-tgz.sh artifacts/cdt-*.tar.gz
          tools/packaging/tests/verify-deb.sh artifacts/cdt_*_amd64.deb artifacts/cdt-dev_*_amd64.deb
          # cdt-[0-9]* matches the base rpm only (the dev rpm is cdt-dev-*).
          tools/packaging/tests/verify-rpm.sh artifacts/cdt-[0-9]*.rpm artifacts/cdt-dev-*.rpm

  notification:
    name: Send Notification
    needs: [discover, build-platforms, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: always()
        uses: Wire-Network/notification-action@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          notification-type: 1
          workflow-name: "CDT Build & Test"
          job-results: "discover:${{ needs.discover.result }} build-platforms:${{ needs.build-platforms.result == 'skipped' && 'success' || needs.build-platforms.result }} build:${{ needs.build.result }}"
          github-context: ${{ toJSON(github) }}
