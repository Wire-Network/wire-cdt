name: "Build & Test"

on:
  push:
    branches:
      - master
      - "release/*"
  pull_request:
    branches: 
      - master
  workflow_dispatch:

permissions:
  packages: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover Platforms
    runs-on: ubuntu-24.04
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      p: ${{steps.discover.outputs.platforms}}
    steps:
      - name: Discover Platforms
        id: discover
        uses: Wire-Network/discover-platforms-action@v2
        with:
          platform-file: .cicd/platforms.json
          password: ${{secrets.GH_TOKEN}}
          package-name: builders-cdt
  build-platforms:
    name: Build Platforms
    needs: discover
    if: needs.discover.outputs.missing-platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.discover.outputs.missing-platforms)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
          file: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].dockerfile}}
  build:
    name: Build & Test
    needs: [discover, build-platforms]
    if: always() && needs.discover.result == 'success' && (needs.build-platforms.result == 'success' || needs.build-platforms.result == 'skipped')
    env:
      VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu24]
    runs-on: ubuntu-24.04
    container: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
    steps:
        - uses: actions/checkout@v5
          with:
            submodules: recursive
        - name: Cache ccache
          uses: actions/cache@v5
          with:
            path: .ccache
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ github.sha }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-ccache-
        - name: Cache vcpkg downloads and tool archives
          uses: actions/cache@v5
          with:
            path: |
              vcpkg/downloads
              ~/.cache/vcpkg/archives
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-
        - name: Setup build environment
          run: |
            echo $PWD
            ls -la

            echo "CC=/usr/bin/clang-18" >> "$GITHUB_ENV"
            echo "CXX=/usr/bin/clang++-18" >> "$GITHUB_ENV"
            echo "CMAKE_MAKE_PROGRAM=/usr/bin/ninja" >> "$GITHUB_ENV"
            echo "VCPKG_TARGET_TRIPLET=x64-linux-release" >> "$GITHUB_ENV"
            echo "VCPKG_HOST_TRIPLET=x64-linux-release" >> "$GITHUB_ENV"
            echo "VCPKG_OVERLAY_TRIPLETS=$PWD/.github/vcpkg-triplets" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
            echo "VCPKG_FEATURE_FLAGS=manifests,binarycaching" >> "$GITHUB_ENV"

            cmake --version 
            ccache --version
        - name: Bootstrap vcpkg
          run: |
            ./vcpkg/bootstrap-vcpkg.sh

            chown -R $(id -u):$(id -g) $PWD
        - name: Configure NuGet authentication
          if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          env:
            GITHUB_TOKEN: ${{ github.token }}
          run: |
            NUGET_EXE="$(./vcpkg/vcpkg fetch nuget | tail -n 1)"

            mono "$NUGET_EXE" sources remove \
              -Name "github" || true

            mono "$NUGET_EXE" sources add \
              -Name "github" \
              -Source "$VCPKG_NUGET_FEED" \
              -UserName "${{ github.repository_owner }}" \
              -Password "$GITHUB_TOKEN" \
              -StorePasswordInClearText

            mono "$NUGET_EXE" setapikey \
              "$GITHUB_TOKEN" \
              -Source "$VCPKG_NUGET_FEED"
        - name: Configure vcpkg binary cache
          run: |
            if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "Using local-only vcpkg binary cache for fork pull request."
              echo "VCPKG_BINARY_SOURCES=clear;default,readwrite" >> "$GITHUB_ENV"
            else
              echo "Using GitHub Packages vcpkg binary cache in readwrite mode."
              echo "VCPKG_BINARY_SOURCES=clear;nuget,$VCPKG_NUGET_FEED,readwrite" >> "$GITHUB_ENV"
            fi
        - name: Configure CMake
          run: |
            cmake -B build -S . -G Ninja \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_MAKE_PROGRAM="$CMAKE_MAKE_PROGRAM" \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
              -DVCPKG_HOST_TRIPLET="$VCPKG_HOST_TRIPLET" \
              -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS"
        - name: Build
          run: |
            cmake --build build -- -j $(nproc)
        - name: Test
          run: |
            ctest --test-dir build/tests -j $(nproc) --output-on-failure
  notification:
    name: Send Notification
    needs: [discover, build-platforms, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: always()
        uses: Wire-Network/notification-action@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          notification-type: 1
          workflow-name: "CDT Build & Test"
          job-results: "discover:${{ needs.discover.result }} build-platforms:${{ needs.build-platforms.result }} build:${{ needs.build.result }}"
          github-context: ${{ toJSON(github) }}
