name: "Build & Test"

on:
  push:
    branches:
      - master
      - "release/*"
  pull_request:
    branches: 
      - master
  workflow_dispatch:

permissions:
  packages: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover Platforms
    runs-on: ubuntu-24.04
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      p: ${{steps.discover.outputs.platforms}}
    steps:
      - name: Discover Platforms
        id: discover
        uses: Wire-Network/discover-platforms-action@v1
        with:
          platform-file: .cicd/platforms.json
          password: ${{secrets.GH_TOKEN}}
          package-name: builders-cdt
  build-platforms:
    name: Build Platforms
    needs: discover
    if: needs.discover.outputs.missing-platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.discover.outputs.missing-platforms)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
          file: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].dockerfile}}
  Build:
    name: Build & Test
    needs: [discover, build-platforms]
    if: always() && needs.discover.result == 'success' && (needs.build-platforms.result == 'success' || needs.build-platforms.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu24]
    runs-on: ubuntu-24.04
    container: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
    steps:
        - uses: actions/checkout@v3
          with:
            submodules: recursive
        # - name: Download leap-dev.deb (Ubuntu 20 only)
        #   if: matrix.platform == 'ubuntu20'
        #   uses: AntelopeIO/asset-artifact-download-action@v2
        #   with:
        #     owner: AntelopeIO
        #     repo: leap
        #     file: 'leap-dev.*(x86_64|amd64).deb'
        #     target: 4.0
        #     artifact-name: leap-dev-ubuntu20-amd64
        #     container-package: experimental-binaries
        #     token: ${{github.token}}
        # - name: Install leap-dev.deb (Ubuntu 20 only)
        #   if: matrix.platform == 'ubuntu20'
        #   run: |
        #     apt-get update && apt-get upgrade -y
        #     apt install -y ./leap-dev*.deb
        #     rm ./leap-dev*.deb
        - name: Build & Test
          run: |
            echo $PWD
            ls -la

            rm -rf vcpkg/downloads vcpkg/packages vcpkg/buildtrees
            
            export CC=/usr/bin/clang-18
            export CXX=/usr/bin/clang++-18
            export CMAKE_MAKE_PROGRAM=/usr/bin/ninja
            cmake --version 
            ./vcpkg/bootstrap-vcpkg.sh
            
            chown -R $(id -u):$(id -g) $PWD
            
            env CC=/usr/bin/clang-18 CXX=/usr/bin/clang++-18 \
            cmake -B build -S . -G Ninja \
              -DCMAKE_C_COMPILER=$CC \
              -DCMAKE_CXX_COMPILER=$CXX \
              -DCMAKE_MAKE_PROGRAM=$CMAKE_MAKE_PROGRAM \
              -DCMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=/opt/llvm/llvm-11 
            
            cmake --build build -- -j $(nproc)

            cd build/tests 

            ctest -j $(nproc) --output-on-failure
          # run: |
          #   mkdir build
          #   cd build
          #   cmake -DCMAKE_BUILD_TYPE=Release ..
          #   make -j $(nproc)
          #   cd tests
          #   ctest -j $(nproc) --output-on-failure
        # - name: Package (Ubuntu 18 only)
        #   if: matrix.platform == 'ubuntu18'
        #   run: |
        #     cd build/packages
        #     bash generate_package.sh deb ubuntu amd64
        # - name: Upload (Ubuntu 18 only)
        #   if: matrix.platform == 'ubuntu18'
        #   uses: actions/upload-artifact@v3
        #   with:
        #     name: cdt_ubuntu_package_amd64
        #     path: build/packages/cdt*amd64.deb
  notification:
    name: Send Notification
    needs: [discover, build-platforms, Build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Mattermost Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Determine overall status
          if [[ "${{ needs.discover.result }}" == "success" && \
                ("${{ needs.build-platforms.result }}" == "success" || "${{ needs.build-platforms.result }}" == "skipped") && \
                "${{ needs.Build.result }}" == "success" ]]; then
            STATUS="✅ SUCCESS"
            COLOR="#00FF00"
          else
            STATUS="❌ FAILURE"
            COLOR="#FF0000"
          fi

          # Build job status details
          JOB_DETAILS=""
          [[ "${{ needs.discover.result }}" != "success" ]] && JOB_DETAILS="${JOB_DETAILS}\n- **Discover Platforms**: ❌ ${{ needs.discover.result }}"
          [[ "${{ needs.build-platforms.result }}" != "success" && "${{ needs.build-platforms.result }}" != "skipped" ]] && JOB_DETAILS="${JOB_DETAILS}\n- **Build Platforms**: ❌ ${{ needs.build-platforms.result }}"
          [[ "${{ needs.Build.result }}" != "success" ]] && JOB_DETAILS="${JOB_DETAILS}\n- **Build & Test**: ❌ ${{ needs.Build.result }}"

          # Create message payload
          PAYLOAD=$(cat <<EOF
          {
            "channel": "cicd-notifications",
            "username": "GitHub Actions",
            "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "attachments": [{
              "color": "$COLOR",
              "title": "$STATUS: CDT Build & Test",
              "text": "**Repository**: ${{ github.repository }}\n**Branch**: ${{ github.ref_name }}\n**Commit**: [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n**Triggered by**: ${{ github.actor }}\n**Workflow Run**: [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})${JOB_DETAILS}"
            }]
          }
          EOF
          )

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"