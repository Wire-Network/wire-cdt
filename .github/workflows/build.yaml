name: "Build & Test"

on:
  push:
    branches:
      - master
      - "release/*"
    # Tag runs produce the Linux release package set. NOTE: a tag created by a
    # workflow (GITHUB_TOKEN) fires no push event, so tag-release.yaml also
    # dispatches this workflow explicitly on the tag ref; the workflow_dispatch
    # trigger below is what makes that possible. Mirrors build-macos.yaml.
    tags:
      - "v*"
  pull_request:
    branches: 
      - master
      - develop
  workflow_dispatch:

permissions:
  # build-platforms publishes the container image to GHCR.
  packages: write
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover Platforms
    runs-on: ubuntu-24.04
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      p: ${{steps.discover.outputs.platforms}}
    steps:
      - name: Discover Platforms
        id: discover
        uses: Wire-Network/discover-platforms-action@v2
        with:
          platform-file: .cicd/platforms.json
          password: ${{secrets.GH_TOKEN}}
          package-name: builders-cdt
  build-platforms:
    name: Build Platforms
    needs: discover
    if: needs.discover.outputs.missing-platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.discover.outputs.missing-platforms)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
          file: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].dockerfile}}
  build:
    name: Build & Test
    needs: [discover, build-platforms]
    # !cancelled() (not always()) so this job still runs when build-platforms is
    # skipped, but a cancelled run actually stops it. always() makes the job run
    # even when the workflow is cancelled, which is why cancelling left the build
    # running to completion.
    if: ${{ !cancelled() && needs.discover.result == 'success' && (needs.build-platforms.result == 'success' || needs.build-platforms.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu24]
    runs-on: ubuntu-24.04
    container: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
    env:
      # Package on every ubuntu24 build (PRs included): verify-packages and the
      # release workflow both consume the artifact, and PR coverage catches
      # packaging regressions before merge (same policy as wire-sysio).
      SHOULD_PACKAGE: ${{ matrix.platform == 'ubuntu24' }}
      CCACHE_MAXSIZE: "10G"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
        - uses: actions/checkout@v5
          with:
            submodules: recursive
        - name: Read ccache identity
          id: ccache-info
          run: |
            ccache_version=$(ccache --version | awk 'NR == 1 { print $3 }')
            echo "version=${ccache_version}" >> "$GITHUB_OUTPUT"
            case "${ccache_version}" in
              4.9.1|4.13.6)
                echo "allow_cdt_launcher=ON" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "allow_cdt_launcher=OFF" >> "$GITHUB_OUTPUT"
                echo "::warning::Disabling CDT wrapper caching for unvalidated ccache ${ccache_version}"
                ;;
            esac
            compiler_identity=$(git ls-files -s \
              CMakeLists.txt cmake tools plugins .github/vcpkg-triplets \
              vcpkg vcpkg.json vcpkg-configuration.json | git hash-object --stdin)
            echo "compiler=${compiler_identity}" >> "$GITHUB_OUTPUT"
        - name: Restore ccache
          id: restore-ccache
          uses: actions/cache/restore@v5
          with:
            path: |
              .ccache
              .ccache-native
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ steps.ccache-info.outputs.version }}-${{ steps.ccache-info.outputs.compiler }}-${{ github.sha }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ steps.ccache-info.outputs.version }}-${{ steps.ccache-info.outputs.compiler }}-
        - name: Restore vcpkg downloads
          id: restore-vcpkg-downloads
          uses: actions/cache/restore@v5
          with:
            path: vcpkg/downloads
            # Caches are immutable: save (below, on always()) uses this unique
            # per-run key so failed/cancelled builds still bank their vcpkg work;
            # restore takes the newest cache by prefix, preferring one built from
            # the same manifests.
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}-
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-downloads-
        - name: Restore vcpkg binary archives
          id: restore-vcpkg-binary
          uses: actions/cache/restore@v5
          with:
            path: .vcpkg-binary-cache
            # STABLE key (no run_id/run_attempt), matching wire-sysio: the paired
            # save below runs on an exact-key MISS only, so `cache-hit == 'true'`
            # has to be a reachable state. A per-run key would make the exact
            # match impossible and turn every run into a wasted upload onto an
            # already-existing key (caches are immutable).
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-
        - name: Build
          run: |
            export CC=/usr/bin/clang-18
            export CXX=/usr/bin/clang++-18
            export CCACHE_DIR="$PWD/.ccache"
            # VCPKG_BINARY_SOURCES only works as an environment variable: vcpkg.cmake
            # consumes no -D of that name, so the previous -D form silently did nothing
            # and vcpkg wrote its archives to ~/.cache/vcpkg outside the cached path.
            export VCPKG_BINARY_SOURCES="clear;files,$PWD/.vcpkg-binary-cache,readwrite"
            cmake --version
            ccache --version

            chown -R "$(id -u):$(id -g)" "$PWD"
            ./vcpkg/bootstrap-vcpkg.sh

            cmake -B build -S . -G Ninja \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCDT_ALLOW_COMPILER_LAUNCHER=${{ steps.ccache-info.outputs.allow_cdt_launcher }} \
              -DCDT_NATIVE_CCACHE_DIR="$PWD/.ccache-native" \
              -DCDT_CCACHE_COMPILER_CHECK="string:${{ steps.ccache-info.outputs.compiler }}" \
              -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_TARGET_TRIPLET=x64-linux-release \
              -DVCPKG_HOST_TRIPLET=x64-linux-release \
              -DVCPKG_OVERLAY_TRIPLETS="$PWD/.github/vcpkg-triplets"

            cmake --build build -- -j "$(nproc)"
            ccache --show-stats
            CCACHE_DIR="$PWD/.ccache-native" ccache --show-stats
        # The saves sit immediately after Build (same ordering as
        # build-macos.yaml) so the expensive vcpkg/ccache work is banked even
        # when Test or the packaging steps below fail.
        - name: Save ccache
          # PRs restore matching caches seeded by trusted pushes. Compiler-changing
          # PRs intentionally build cold instead of publishing executable objects.
          if: ${{ always() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true' }}
          uses: actions/cache/save@v5
          with:
            path: |
              .ccache
              .ccache-native
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ steps.ccache-info.outputs.version }}-${{ steps.ccache-info.outputs.compiler }}-${{ github.sha }}
        - name: Save vcpkg downloads
          # always(): bank the downloaded sources even when the build fails or is
          # cancelled — cancel-in-progress iteration otherwise discards them on
          # every push. The key is per-run, so there is never a collision; the
          # guard only skips the save when the restore step never ran at all.
          if: ${{ always() && steps.restore-vcpkg-downloads.outputs.cache-primary-key != '' }}
          uses: actions/cache/save@v5
          with:
            path: vcpkg/downloads
            key: ${{ steps.restore-vcpkg-downloads.outputs.cache-primary-key }}
        - name: Save vcpkg binary archives
          # wire-sysio's shape: stable key + save only on an exact-key MISS.
          # Caches are immutable, so saving onto an existing key is a wasted
          # upload that logs a warning.
          if: ${{ success() && steps.restore-vcpkg-binary.outputs.cache-hit != 'true' }}
          uses: actions/cache/save@v5
          with:
            path: .vcpkg-binary-cache
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-binary-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}
        - name: Restore CTest cost data
          uses: actions/cache/restore@v5
          with:
            # CTest schedules higher-cost tests first when running with -j.
            path: build/Testing/Temporary/CTestCostData.txt
            key: ctest-cost-${{ matrix.platform }}-${{ github.sha }}
            restore-keys: |
              ctest-cost-${{ matrix.platform }}-
        - name: Test
          run: |
            TEST_COUNT="$(ctest --test-dir build -N | sed -nE 's/^Total Tests:[[:space:]]*([0-9]+).*/\1/p' | tail -n 1)"
            if [[ -z "$TEST_COUNT" || "$TEST_COUNT" -eq 0 ]]; then
              echo "CTest discovered no tests in build." >&2
              exit 1
            fi
            ctest --test-dir build -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)" --output-on-failure
        - name: Save CTest cost data
          if: ${{ always() && hashFiles('build/Testing/Temporary/CTestCostData.txt') != '' }}
          uses: actions/cache/save@v5
          with:
            # Caches are immutable; save under a unique key, restore by prefix.
            path: build/Testing/Temporary/CTestCostData.txt
            key: ctest-cost-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        - name: Build packages (tgz + deb + rpm, base + dev)
          if: env.SHOULD_PACKAGE == 'true'
          working-directory: build
          run: |
            # The RPM generator needs rpmbuild. The ubuntu24 builder image bakes
            # the `rpm` package (which ships /usr/bin/rpmbuild on Debian) in, so
            # this normally does nothing; the apt fallback stays for an older
            # cached image that predates that change.
            command -v rpmbuild >/dev/null || { apt-get update && apt-get install -y rpm; }
            cpack -G DEB
            cpack -G RPM
            cmake --build . --target package-tgz
            ls -lh wire-cdt*.deb wire-cdt*.rpm wire-cdt*.tar.gz
        - name: Upload package artifacts
          if: env.SHOULD_PACKAGE == 'true'
          uses: actions/upload-artifact@v7
          with:
            name: wire-cdt-packages-amd64
            path: |
              build/wire-cdt_*.deb
              build/wire-cdt-dev_*.deb
              build/wire-cdt-*.rpm
              build/wire-cdt-*.tar.gz
            if-no-files-found: error
            retention-days: 30
            compression-level: 0
  verify-packages:
    name: Verify packages
    needs: [build]
    # Same guard pattern as `build`: build-platforms is usually skipped (image
    # already published), and a skipped ancestor propagates through the default
    # success() check, silently skipping this job.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: wire-cdt-packages-amd64
          path: artifacts
      - name: Run packaging verification suite
        run: |
          # No version argument: on this path the artifact names carry a version
          # this job does not know, so the suite uses its documented safe globs.
          # The suite owns the artifact list and the no-bare-tgz-glob rule, shared
          # with release.yaml's verification of the same package set.
          tools/packaging/tests/verify-all.sh artifacts

  all-passing:
    name: All Required Tests Passed
    # THE required check for this workflow. It exists because `needs` on a
    # SKIPPED job (build-platforms, whenever the builder image is already
    # published) passes the default success() gate, so a branch-protection rule
    # pointed at the individual jobs could go green on a run that never built.
    # The verdict is therefore made explicitly below. Mirrors
    # wire-sysio/.github/workflows/linux_amd64_build.yaml's all-passing.
    needs: [discover, build-platforms, build, verify-packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # build and verify-packages are the only two that must SUCCEED:
      # build-platforms is legitimately skipped, and a failed discover already
      # shows up as a non-success `build`.
      - if: needs.build.result != 'success' || needs.verify-packages.result != 'success'
        run: false

  notification:
    name: Send Notification
    # verify-packages and all-passing are real gates on this workflow's outcome,
    # so the notification must both wait for them and report them.
    needs: [discover, build-platforms, build, verify-packages, all-passing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: always()
        uses: Wire-Network/notification-action@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          notification-type: 1
          workflow-name: "CDT Build & Test"
          # Comma-separated, matching wire-sysio's all-passing notification.
          job-results: "discover:${{ needs.discover.result }},build-platforms:${{ needs.build-platforms.result == 'skipped' && 'success' || needs.build-platforms.result }},build:${{ needs.build.result }},verify-packages:${{ needs.verify-packages.result }},all-passing:${{ needs.all-passing.result }}"
          github-context: ${{ toJSON(github) }}
