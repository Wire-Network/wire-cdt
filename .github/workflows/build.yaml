name: "Build & Test"

on:
  push:
    branches:
      - master
      - "release/*"
  pull_request:
    branches: 
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover Platforms
    runs-on: ubuntu-24.04
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      p: ${{steps.discover.outputs.platforms}}
    steps:
      - name: Discover Platforms
        id: discover
        uses: Wire-Network/discover-platforms-action@v2
        with:
          platform-file: .cicd/platforms.json
          password: ${{secrets.GH_TOKEN}}
          package-name: builders-cdt
  build-platforms:
    name: Build Platforms
    needs: discover
    if: needs.discover.outputs.missing-platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.discover.outputs.missing-platforms)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
          file: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].dockerfile}}
  build:
    name: Build & Test
    needs: [discover, build-platforms]
    if: always() && needs.discover.result == 'success' && (needs.build-platforms.result == 'success' || needs.build-platforms.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu24]
    runs-on: ubuntu-24.04
    container: ${{fromJSON(needs.discover.outputs.p)[matrix.platform].image}}
    steps:
        - uses: actions/checkout@v3
          with:
            submodules: recursive
        - name: Cache ccache
          uses: actions/cache@v5
          with:
            path: .ccache
            key: ${{ runner.os }}-${{ matrix.platform }}-ccache-${{ github.sha }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-ccache-
        - name: Cache vcpkg downloads
          uses: actions/cache@v5
          with:
            path: |
              vcpkg/downloads
              ~/.cache/vcpkg/archives
            key: ${{ runner.os }}-${{ matrix.platform }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}
            restore-keys: |
              ${{ runner.os }}-${{ matrix.platform }}-vcpkg-
        - name: Build & Test
          run: |
            echo $PWD
            ls -la

            export CC=/usr/bin/clang-18
            export CXX=/usr/bin/clang++-18
            export CMAKE_MAKE_PROGRAM=/usr/bin/ninja
            export VCPKG_TARGET_TRIPLET=x64-linux-release
            export VCPKG_HOST_TRIPLET=x64-linux-release
            export VCPKG_OVERLAY_TRIPLETS=$PWD/.github/vcpkg-triplets
            export CCACHE_DIR=$PWD/.ccache
            export CCACHE_MAXSIZE=5G
            cmake --version 
            ccache --version
            ./vcpkg/bootstrap-vcpkg.sh
            
            chown -R $(id -u):$(id -g) $PWD
            
            env CC=/usr/bin/clang-18 CXX=/usr/bin/clang++-18 \
            cmake -B build -S . -G Ninja \
              -DCMAKE_C_COMPILER=$CC \
              -DCMAKE_CXX_COMPILER=$CXX \
              -DCMAKE_MAKE_PROGRAM=$CMAKE_MAKE_PROGRAM \
              -DCMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET \
              -DVCPKG_HOST_TRIPLET=$VCPKG_HOST_TRIPLET \
              -DVCPKG_OVERLAY_TRIPLETS=$VCPKG_OVERLAY_TRIPLETS
            
            cmake --build build -- -j $(nproc)

            cd build/tests 

            ctest -j $(nproc) --output-on-failure
  notification:
    name: Send Notification
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: always()
        uses: Wire-Network/notification-action@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          notification-type: 1
          workflow-name: "CDT Build & Test"
          job-results: "discover:${{ needs.discover.result }} build-platforms:${{ needs.build-platforms.result }} Build:${{ needs.Build.result }}"
          github-context: ${{ toJSON(github) }}
