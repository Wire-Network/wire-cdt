name: Publish Release

# Strategy C: tag-release.yaml creates the tag + a DRAFT release and then
# dispatches this workflow with the tag. This workflow gathers the tag-ref
# build artifacts, verifies each one explicitly, attaches them with a checksums
# file, and flips the draft public. The `push: tags` trigger is the manual
# fallback for a human-pushed stable tag.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v*-*"
  # Primary path under Strategy C (and the debug/validation path): run the same
  # verify-and-publish flow against an existing tag, pre-release suffixes
  # included.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify and publish (e.g. v1.0.0 or v1.0.0-dev)"
        type: string
        required: true
      skip-master-check:
        description: "DEBUG ONLY: allow a tag whose commit is not on master"
        type: boolean
        default: false

# No ambient token scope: every job declares exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # NEVER cancel a release in flight: a cancelled run can leave a draft with a
  # partial asset set. Re-dispatching is idempotent (upload --clobber), so a
  # queued second run is safe; a killed first one is not.
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag
        id: validate
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SKIP_MASTER_CHECK: ${{ inputs.skip-master-check }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"

          # SHAPE is cmake-version.py's job: it owns the ONE VERSION_RE that
          # prepare-release.yaml and tag-release.yaml also validate against, so an
          # inline regex here could (and did) drift from the parser that writes
          # the tree. NOTE this TIGHTENS the previous inline pattern, which also
          # accepted a hyphen inside the suffix (v1.0.0-rc-1); the canonical
          # grammar is dot-separated alphanumerics only.
          tag_version="$(python3 .github/scripts/cmake-version.py validate --tag "$tag")" \
            || { echo "::error::Tag '$tag' must match vX.Y.Z (or vX.Y.Z-suffix via dispatch)."; exit 1; }

          # The PATH rule stays here, because it is about how this run was
          # triggered rather than about the tag's grammar: a suffixed tag is
          # reachable via the dispatch input alone (the `push` trigger filters
          # `!v*-*`, and this is the belt to that braces).
          if [[ -z "$INPUT_TAG" && "$tag_version" == *-* ]]; then
            echo "::error::Tag '$tag' carries a pre-release suffix; suffixed tags are published via workflow_dispatch only."
            exit 1
          fi

          target_sha="$(git rev-parse "HEAD^{commit}")"
          git fetch --force origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$target_sha" origin/master; then
            if [[ "$SKIP_MASTER_CHECK" == "true" ]]; then
              echo "::warning::Tag '$tag' ($target_sha) is not on master; continuing (skip-master-check)."
            else
              echo "::error::Tag '$tag' points to $target_sha, which is not on origin/master."
              exit 1
            fi
          fi

          # ONE parser for the VERSION_* block, shared with prepare-release.yaml
          # (which writes it) and tag-release.yaml (which asserts it) -- so the
          # three cannot drift apart. VERSION_SUFFIX is the release channel: any
          # suffix means prerelease, no suffix means stable.
          version_full="$(python3 .github/scripts/cmake-version.py read)"
          prerelease="false"
          [[ "$version_full" == *-* ]] && prerelease="true"

          # Cross-check the FULL tag, not just its core: a stable tag against a
          # `-dev` tree (or a `-rc1` tag against a stable tree) is a mismatch,
          # and the channel the release is published under derives from the
          # same suffix.
          if [[ "$tag" != "v${version_full}" ]]; then
            echo "::error::Tag '$tag' does not match CMake version 'v${version_full}' (VERSION_MAJOR/MINOR/PATCH/SUFFIX in CMakeLists.txt)."
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version_full"
            echo "target_sha=$target_sha"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish GitHub Release
    needs: validate-tag
    runs-on: ubuntu-latest
    # tag-release.yaml dispatches this workflow at the same moment it dispatches
    # the platform builds, so this job waits out a full cold build (a cold
    # LLVM-via-vcpkg build is hours, not minutes). Kept under the 6h
    # GitHub-hosted job ceiling.
    #
    # PHASE BUDGET (the resolver is not the only tenant of this timeout):
    #   resolver  <= 330m  330 polls x 60s sleep, in the "Resolve build runs" step
    #   verify     ~ 20m   containerized deb+rpm install, find_package, contract
    #                      compile and static-lib build, pulling ubuntu:24.04 and
    #                      fedora:latest
    #   publish    ~  5m   checksums + asset upload
    #                ----
    #   total      ~355m   -> 390 leaves headroom rather than letting a
    #                         slow-but-SUCCESSFUL build time out during
    #                         verification instead of failing on a real defect.
    #   (was 350, i.e. under the sum of its own phases.)
    timeout-minutes: 390
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate-tag.outputs.tag }}
      TARGET_SHA: ${{ needs.validate-tag.outputs.target_sha }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
      PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.target_sha }}

      - name: Resolve build runs for the released tag
        id: run
        run: |
          set -euo pipefail
          # The resolver (poll loop, tag-ref filtering, candidate dump, budgets)
          # is byte-identical with wire-sysio's copy of this script; only the
          # workflows to wait for differ, so they are the arguments. It writes
          # `build-run-id=` / `build-macos-run-id=` on stdout and every progress
          # line on stderr, so this redirect cannot corrupt $GITHUB_OUTPUT.
          .github/scripts/resolve-build-run.sh "$TAG" "$TARGET_SHA" \
            build.yaml build-macos.yaml >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: wire-cdt-packages-amd64
          path: dist
          run-id: ${{ steps.run.outputs.build-run-id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v7
        with:
          name: wire-cdt-packages-macos-arm64
          path: dist
          run-id: ${{ steps.run.outputs.build-macos-run-id }}
          github-token: ${{ github.token }}

      - name: Guard release tag matches artifact version
        run: |
          set -euo pipefail
          ls -la dist/
          # The deb file name carries VERSION_FULL verbatim, so this guard
          # catches a suffixed mismatch (v1.0.0 vs a 1.0.0-dev tree) that a
          # core-version-only check would wave through.
          [[ -f "dist/wire-cdt_${VERSION}_amd64.deb" ]] \
            || { echo "::error::Tag $TAG does not match the artifact version (bump VERSION_* in CMakeLists.txt before tagging)."; exit 1; }

      - name: Verify packages
        run: |
          set -euo pipefail
          # Passing VERSION selects the explicit-names mode: the suite owns the
          # artifact list and the no-bare-tgz-glob rule in one place, shared with
          # build.yaml's verification of the same package set.
          tools/packaging/tests/verify-all.sh dist "$VERSION"

      - name: Publish release
        run: |
          set -euo pipefail

          # Checksums are generated from INSIDE dist/ over an explicit, ordered
          # file list: `sha256sum dist/*` would write `dist/`-prefixed paths into
          # the file (useless to a downloader running `sha256sum -c`) and would
          # depend on glob order to avoid hashing the checksums file itself.
          # 6 package assets + the checksums file = 7 (GitHub adds the source
          # zip/tar.gz archives on top, automatically).
          (
            cd dist
            sha256sum \
              "wire-cdt_${VERSION}_amd64.deb" \
              "wire-cdt-dev_${VERSION}_amd64.deb" \
              "wire-cdt-${VERSION}-x86_64.rpm" \
              "wire-cdt-dev-${VERSION}-x86_64.rpm" \
              "wire-cdt-${VERSION}-x86_64.tar.gz" \
              "wire-cdt-${VERSION}-macos-arm64.tar.gz" \
              > "wire-cdt-${VERSION}-checksums.txt"
          )
          cat "dist/wire-cdt-${VERSION}-checksums.txt"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Strategy C: tag-release.yaml already created the DRAFT release
            # (title, notes and the prerelease flag are set there). Attach the
            # assets, then make it public. A GITHUB_TOKEN draft flip does NOT
            # re-fire `release: published`, so there is no recursion.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            # Fallback only (a human-pushed tag with no draft prepared).
            prerelease_flag=""
            [[ "$PRERELEASE" == "true" ]] && prerelease_flag="--prerelease"
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag $prerelease_flag
          fi
